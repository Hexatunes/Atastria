<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Atastria</title>
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="stylesheet" href="./CSS/home.css">

</head>

<body>

    <div id = "LogoContainer"></div>
    <img id = "Logo" src = "../../UniversalSprites/AtastriaLogoWithBG.png">




    <audio id = "BGM" loop src = "./Audio/Music/TitleBGM.mp3"></audio>
    <audio id = "ClickSound" src = "../../UniversalAudio/Click.ogg"></audio>

    <button id = "ToStudyMode" onclick="switchToStudyMode()">Study Mode</button>
    <button id = "ToFlashcardBuilder" onclick="switchToFlashcardBuilder()">Flashcard Builder</button>


    <div id = "StartPrompt" onclick="startGame()">
        <img id = "SplashImage" src = "../../UniversalSprites/SplashScreen.png">
        <p id = "StartText">Click to start!</p>
    </div>

    <div id="transition">
        <div class="layer dark"></div>
        <div class="layer white"></div>
        
        <img class="logo" src="../../UniversalSprites/AtastriaLogoDark.png">
    </div>

    <script src="./JS/home.js"></script>
</body>
</html>
