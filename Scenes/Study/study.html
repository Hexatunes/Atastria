<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Atastria</title>
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="stylesheet" href="./CSS/study.css">

</head>

<body>

    <input type = "image" src = "../../UniversalSprites/BackArrow.png" id = "back" onclick = "back()">

    <audio id = "BGM" loop src = "./Audio/TitleBGM.mp3" autoplay></audio>
    <audio id = "ClickSound" src = "../../UniversalAudio/Click.ogg"></audio>




    <div id = "FlashsetList"></div>
    <p id = "TitleInfo">Pick a Flashset to study with!</p>

    
    <p id = "NoSetsLabel">You have no Flashsets! Make one with the Flashset builder.</p>

    <div id = "StandardShadow" style="display: none;"></div>
    <div id = "StandardDiv" style="display: none;">
        <input id = "StandardImage" src = "./Sprites/Standard.png" type = "image" onclick="standardBattle()">
        <button id = "Standard" onclick="standardBattle()">Standard</button>
    </div>

    
        

    <div id="transition">
        <div class="layer dark"></div>
        <div class="layer white"></div>

        <img class="logo" src="../../UniversalSprites/AtastriaLogoDark.png">
    </div>

    <script src="./JS/study.js"></script>
</body>
</html>
