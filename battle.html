<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Atastria</title>
  <meta name="viewport" content="width=device-width">
  <link rel="icon" type="image/x-icon" href="/Scenes/favicon.ico">

  <link rel="stylesheet" href="/Scenes/Battle/CSS/battle.css">

</head>

<body>

    <img id = "bgLayer1" class = "shake" style="--shake-amt: 3" src = "/Scenes/Battle/Sprites/battle.jpeg">

    <input type = "image" src = "/UniversalSprites/BackArrow.png" id = "back" onclick = "back()">
    <audio id = "BGM" loop src = "/Scenes/Battle/Audio/Music/battle.mp3" autoplay></audio>
    <audio id = "ClickSound" src = "/UniversalAudio/Click.ogg"></audio>

    <img id = "enemySlot0" src = "" class = "shake" style="--shake-amt: 4">
    <img id = "enemySlot1" src = "" class = "shake" style="--shake-amt: 4">
    <img id = "enemySlot2" src = "" class = "shake" style="--shake-amt: 4">
    <div id = "enemyHP0" class = "enemyHP shake" style="--shake-amt: 4">
        <div id = "enemyHP0Fill" class = "enemyHPFill"></div>
    </div>
    <div id = "enemyHP1" class = "enemyHP shake" style="--shake-amt: 4">
        <div id = "enemyHP1Fill" class = "enemyHPFill"></div>
    </div>
    <div id = "enemyHP2" class = "enemyHP shake" style="--shake-amt: 4">
        <div id = "enemyHP2Fill" class = "enemyHPFill"></div>
    </div>


    <img id = "mySlot" src = "" class = "shake" style="--shake-amt: 6">

    <div id = "teamData">
        <img id = "myIcon0" src = "">
        <img id = "myIcon1" src = "">
        <img id = "myIcon2" src = "">
        <div id = "myHP0" class = "myHP">
            <div id = "myHP0Fill" class = "myHPFill"></div>
        </div>
        <div id = "myHP1" class = "myHP">
            <div id = "myHP1Fill" class = "myHPFill"></div>
        </div>
        <div id = "myHP2" class = "myHP">
            <div id = "myHP2Fill" class = "myHPFill"></div>
        </div>
    </div>

    
    
    
    <img id = "team0" src = "" style="display: none;">
    <img id = "team1" src = "" style="display: none;">
    <img id = "team2" src = "" style="display: none;">

    <img id = "sub3" src = "" style="display: none;">
    <img id = "sub4" src = "" style="display: none;">
    <img id = "sub5" src = "" style="display: none;">

    
    <div id = "imanaBar">
        <div id = "imanaFill"></div>
    </div>

    

    <div id = "turnOrderHolder">
        <img id = "turn0" class = "turnOrder">
        <img id = "turn1" class = "turnOrder">
        <img id = "turn2" class = "turnOrder">
        <img id = "turn3" class = "turnOrder">
        <img id = "turn4" class = "turnOrder">
        <img id = "turn5" class = "turnOrder">
    </div>

    <div id = "recognitionFlashcard" class = "flashcard" style="display: none;">
        <p id = "recognitionQuestion" class = "question">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis neque nisl, euismod quis finibus vitae, iaculis sit amet nunc.</p>
        <div id = "answerHolder">
            <button id = "recognitionAnswer1" class = "recogAnswer" onclick="recognitionSubmit(1)">Answer 1</button>
            <button id = "recognitionAnswer2" class = "recogAnswer" onclick="recognitionSubmit(2)">Answer 2</button>
            <button id = "recognitionAnswer3" class = "recogAnswer" onclick="recognitionSubmit(3)">Answer 3</button>
            <button id = "recognitionAnswer4" class = "recogAnswer" onclick="recognitionSubmit(4)">Answer 4</button>
        </div>
        
    </div>

    

    <div id = "recallFlashcard" class = "flashcard" style="display: none;">
        <p id = "recallQuestion" class = "question">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis neque nisl, euismod quis finibus vitae, iaculis sit amet nunc.</p>
        <input id = "recallAnswer">
    </div>

    <p id = "flashcardFeedback" style="display: none;">The correct answer was: </p>

    <p id = "rnrModeText">[Recognition] / Recall</p>
    

    <input id = "attackButton" type="image" src="/Scenes/Battle/Sprites/AttackButton.png" class="hover-button elastic-button" onclick="initiateFlashcard('attack')">
    <input id = "techniqueButton" type="image" src="/Scenes/Battle/Sprites/TechniqueButton.png" class="hover-button elastic-button" onclick="initiateFlashcard('technique')">

    <div id="transition">
        <div class="layer dark"></div>
        <div class="layer white"></div>

        <img class="logo" src="/UniversalSprites/AtastriaLogoDark.png">
    </div>

    <script src = "/Scenes/Battle/CHAR_DATABASE/CHAR_DATABASE.js"></script>
    <script src = "/Scenes/Battle/ENEMY_DATABASE/ENEMY_DATABASE.js"></script>
    <script src="/Scenes/Battle/JS/battle.js"></script>
</body>
</html>
